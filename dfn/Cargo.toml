[package]
name = "dfn"
version = "0.1.0"
edition = "2021"
description = "Tiny C API around DeepFilterNet3 for CleanRecorder"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["staticlib"]

[dependencies]
# DeepFilterNet3 real-time runtime, model embedded in the binary.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
