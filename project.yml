# Generate the Xcode project with:  xcodegen
name: CleanRecorder
options:
  bundleIdPrefix: com.kimzcodes
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  CleanRecorder:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist", "CleanRecorder.entitlements"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kimz Clean Recorder
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.video
        NSMicrophoneUsageDescription: Kimz Clean Recorder records your voice and removes background noise on your Mac.
    entitlements:
      path: App/CleanRecorder.entitlements
      properties:
        com.apple.security.device.audio-input: true
    preBuildScripts:
      - name: Check DeepFilterNet library
        script: |
          if [ ! -f "${PROJECT_DIR}/Vendor/libdfn.a" ]; then
            echo "error: Vendor/libdfn.a is missing. Run ./Scripts/build-dfn.sh once, then build again."
            exit 1
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimzcodes.KimzCleanRecorder
        PRODUCT_NAME: Kimz Clean Recorder
        PRODUCT_MODULE_NAME: CleanRecorder
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OBJC_BRIDGING_HEADER: App/CleanRecorder-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/dfn/include
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Vendor
        OTHER_LDFLAGS: -ldfn
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEAD_CODE_STRIPPING: YES
        ONLY_ACTIVE_ARCH: YES   # libdfn.a is built for this Mac; use --universal for Intel too
